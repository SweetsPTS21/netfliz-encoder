spring.application.name=netfliz-encoder
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8081
# Overriding bean definition
spring.main.allow-bean-definition-overriding=true
# file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
# Logging
logging.level.root=INFO
logging.level.com.netfliz=DEBUG
# Video quality
# 1080p
video.qualities[0].name=1080p
video.qualities[0].width=1920
video.qualities[0].height=1080
video.qualities[0].video-bitrate=5000k
video.qualities[0].audio-bitrate=192k
# 720p
video.qualities[1].name=720p
video.qualities[1].width=1280
video.qualities[1].height=720
video.qualities[1].video-bitrate=3000k
video.qualities[1].audio-bitrate=128k
# 480p
video.qualities[2].name=480p
video.qualities[2].width=854
video.qualities[2].height=480
video.qualities[2].video-bitrate=1500k
video.qualities[2].audio-bitrate=128k
# 360p
video.qualities[3].name=360p
video.qualities[3].width=640
video.qualities[3].height=360
video.qualities[3].video-bitrate=800k
video.qualities[3].audio-bitrate=96k
